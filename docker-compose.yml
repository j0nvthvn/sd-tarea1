services:
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "${REDIS_MEMORY:-10mb}",
        "--maxmemory-policy",
        "${REDIS_POLICY:-allkeys-lru}"
      ]

  scraper:
    build: ./scraper
    depends_on: [redis]
    environment:
      # false = scraping real de Soccerway al iniciar (por defecto)
      # true  = usa data/matches.json (offline, para experimentos reproducibles)
      - SOCCERWAY_OFFLINE=false

  cache:
    build: ./cache
    depends_on: [redis, scraper]
    environment:
      - REDIS_HOST=redis
      - TTL_SECONDS=300
    ports:
      - "8000:5000"

  metricas:
    build: ./metricas
    depends_on: [redis]
    volumes:
      - ./data:/app/data
    ports:
      - "9000:5000"

  generador:
    build: ./generador
    depends_on: [cache, scraper, metricas]
    volumes:
      - ./data:/app/data
    environment:
      - CACHE_URL=http://cache:5000/consulta
      - METRICAS_URL=http://metricas:5000/evento
      - HEALTH_URL=http://scraper:5000/health
      - DISTRIBUCION=zipf
      - ZIPF_S=1.0
      - LLEGADAS=poisson
      - N_CONSULTAS=1000
      - TASA_ARRIBO=20
      - SEED=42
      - CSV_SALIDA=/app/data/generador_zipf.csv
