services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "10mb", "--maxmemory-policy", "allkeys-lru"]

  scraper:
    build: ./scraper
    depends_on: [redis]
    environment:
      # false = scraping real de Soccerway al iniciar (por defecto)
      # true  = usa data/matches.json (offline, para experimentos reproducibles)
      - SOCCERWAY_OFFLINE=false

  cache:
    build: ./cache
    depends_on: [redis, scraper]
    environment:
      - REDIS_HOST=redis
      - TTL_SECONDS=300
    ports:
      - "8000:5000"

  metricas:
    build: ./metricas
    depends_on: [redis]
    volumes:
      - ./data:/app/data

  generador:
    build: ./generador
    depends_on: [cache, scraper]
    volumes:
      # El detalle por consulta se escribe aca para armar los graficos del informe
      - ./data:/app/data
    environment:
      - CACHE_URL=http://cache:5000/consulta
      # depends_on no espera a que el scraper termine de cargar su snapshot
      - HEALTH_URL=http://scraper:5000/health
      - DISTRIBUCION=zipf
      - ZIPF_S=1.0
      - LLEGADAS=poisson
      - N_CONSULTAS=1000
      - TASA_ARRIBO=20
      - SEED=42
      - CSV_SALIDA=/app/data/generador_zipf.csv
